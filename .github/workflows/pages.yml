name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "preset_catalog/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "preset_catalog/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build catalog and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assemble the Pages site
        run: |
          python -m pip install mkdocs==1.6.1
          cp -a preset_catalog site
          python -m mkdocs build --strict --site-dir site/docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy catalog and documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
